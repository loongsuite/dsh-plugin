# Local trace backend for the DSH plugin quickstart: Jaeger, and nothing else.
#
#   docker compose -f examples/quickstart/docker-compose.yml up -d
#   docker compose -f examples/quickstart/docker-compose.yml down
#
# Jaeger v2 receives OTLP directly, so no collector is needed: the plugin exports
# to http://localhost:4318 and the UI is at http://localhost:16686. Traces live
# in memory and disappear when the container stops. Not meant for production —
# there is no authentication and no persistence.

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: dsh-quickstart-jaeger
    restart: unless-stopped
    ports:
      # OTLP/HTTP — the endpoint the plugin exports traces to.
      - "4318:4318"
      # Jaeger UI.
      - "16686:16686"
